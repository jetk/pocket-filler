<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pocket Filler</title>
<style>
  :root {
    /* Pure white sheet. The greys around it are neutral to match — a warm
       chrome against a white sheet reads as a mistake rather than a choice.
       app.js reads --paper, --ink and --dot from here, so this block is the
       one place the sheet's colours are set. */
    --paper: #ffffff;
    --ink: #222222;
    --dot: #c9c9c9;
    --chrome: #f2f2f2;
    --edge: #dcdcdc;

    /* The two movement layers that came first keep their colours, and the
       drawer reuses them so a layer reads the same wherever it appears. */
    --point: #7a4fbf;
    --shape: #1f8a80;
    --path: #b8562f;

    /* How far anything floating has to sit above the bottom of the screen to
       clear the bar. The bar is 90px of its own, plus whatever the device
       reserves for a home indicator — which is 0 on a desktop and about 34px
       on a phone, and is why a flat 98px left these panels tucked behind the
       toolbar on exactly the devices this app is built for. */
    --lift: calc(98px + env(safe-area-inset-bottom, 0px));
  }
  * { box-sizing: border-box; }
  /* Every `display` rule below is an author rule, so each one silently outranks
     the browser's own `[hidden] { display: none }` and the attribute stops
     working on that element — it sets, and nothing happens. That cost an hour
     on the tempo steppers and then showed up again the moment a flex row got a
     hidden attribute. One rule, stated once, with the !important that beats
     every author `display` in the file, rather than remembering to write a
     matching [hidden] selector next to each of them forever. */
  [hidden] { display: none !important; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--paper); color: var(--ink);
    font: 500 14px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; flex-direction: column; }
  /* min-height:0 because a flex item won't shrink below its content's own
     size by default, and a canvas has an intrinsic one. Without it, a taller
     bar — which is what env(safe-area-inset-bottom) makes on a phone with a
     home indicator — pushes the bar off the bottom instead of taking room
     from the sheet. */
  #sheet { flex: 1; min-height: 0; display: block; width: 100%; touch-action: none; }

  /* Two levels: what the tap does on top, everything else below. Both rows
     centre, so the reach is the same wherever the thumb is. */
  #bar {
    display: flex; flex-direction: column; gap: 6px;
    padding: 6px calc(6px + env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom));
    background: var(--chrome); border-top: 1px solid var(--edge);
  }
  .row { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
  button {
    font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--edge); border-radius: 8px;
    height: 36px; min-width: 34px; padding: 0 6px;
    display: grid; place-items: center;
  }
  button:active { background: var(--edge); }
  #mode { min-width: 56px; }
  #mode[data-mode="fill"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  /* Move keeps its own colour: it's the mode where the node handles appear. */
  #mode[data-mode="move"] { background: #2f6fb3; color: #fff; border-color: #2f6fb3; }
  /* Path is the mode where routes are laid, so it wears the path colour the
     drawer and the walkers use. */
  #mode[data-mode="path"] { background: var(--path); color: #fff; border-color: var(--path); }
  button.armed { background: #c0392b; color: #fff; border-color: #c0392b; }
  /* Dots off is a quieter sheet, so the button goes quiet with it. */
  #dots[aria-pressed="false"] { color: #a0a0a0; }

  /* Clears the two-level bar (36 + 36 + gap + padding), as 60px cleared the
     single row it replaced. */
  #toast {
    position: fixed; left: 12px; right: 12px; bottom: calc(var(--lift) + 6px);
    padding: 10px 12px; border-radius: 8px;
    background: var(--ink); color: var(--paper);
    line-height: 1.35; text-align: center;
    opacity: 0; transform: translateY(6px); transition: opacity .2s, transform .2s;
    pointer-events: none; z-index: 5;
  }
  #toast.show { opacity: 1; transform: none; }

  /* Running means at least one layer is on and the clock is turning. It wears
     the colour of whichever movement layer is up, or a neutral when the looks
     are running on their own. */
  #play[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  body[data-move="point"] #play[aria-pressed="true"] { background: var(--point); border-color: var(--point); }
  body[data-move="shape"] #play[aria-pressed="true"] { background: var(--shape); border-color: var(--shape); }
  body[data-move="path"] #play[aria-pressed="true"] { background: var(--path); border-color: var(--path); }
  #animate[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* A pill that hugs its contents rather than a full-width shelf: it floats
     over the drawing for as long as the clock runs, so it should hide as little
     of it as possible. Slightly see-through for the same reason.
     Everything that isn't adjusted mid-performance lives in the drawer; what's
     left here is what you reach for while the music is playing. */
  .dancebar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: var(--lift);
    display: flex; align-items: center; gap: 5px;
    padding: 3px 10px; border-radius: 999px;
    font-size: 12px;
    /* Wants the chrome colour but see-through, so it's mixed from the same
       variable rather than pinned to a copy of it that goes stale. The flat
       rgba above it is the fallback where color-mix isn't understood. */
    background: rgba(242, 242, 242, .92);
    background: color-mix(in srgb, var(--chrome) 92%, transparent);
    border: 1px solid var(--edge);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
    z-index: 4;
    /* In performance mode this carries the whole interface, which on a narrow
       phone can be wider than the phone. Wrapping keeps it on screen; without
       the max-width it would centre and then run off BOTH edges at once.
       `width: max-content` is the part that is not optional: a fixed element at
       `left: 50%` has only the half-viewport to its right as its containing
       block, so shrink-to-fit caps its width there and it wraps at half the
       screen while the room it needs is sitting unused on the other side. */
    width: max-content; max-width: calc(100vw - 16px);
    flex-wrap: wrap; justify-content: center;
  }
  .dancebar label { opacity: .7; }
  .dancebar input[type="range"] { width: 46px; height: 18px; margin: 0; }
  .dancebar .sep { width: 1px; height: 16px; background: var(--edge); }
  .dancebar output { min-width: 1.1em; text-align: right; font-variant-numeric: tabular-nums; }
  #bpmout { min-width: 2.4em; text-align: center; }
  /* Small enough to sit in the pill, big enough to hit with a thumb. */
  .step {
    width: 22px; min-width: 0; height: 22px; padding: 0;
    font-size: 15px; line-height: 1; border-radius: 6px;
  }
  .step.wide { width: auto; padding: 0 7px; font-size: 11px; }
  .step[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  #hearing { display: flex; gap: 4px; }

  /* On a narrow phone the pill in performance mode carries one control too many
     and wraps. The word "Movers" is the one thing in there that the slider
     beside it already says, so it is what goes; and if a future control makes it
     wrap anyway, a rounded rect degrades better than a 999px radius on a tall
     box. Scoped through the id deliberately — a bare class here would lose to
     `.dancebar label`, which is the collision this file has been bitten by
     three times already. */
  @media (max-width: 380px) {
    .dancebar #countlabel { display: none; }
    .dancebar { border-radius: 18px; gap: 4px; }
  }

  /* One dot that lights on the beat. It is the only readout of where the clock
     actually is, which matters most during a count-in, when nothing else on the
     sheet is moving yet. */
  #beatdot {
    width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: var(--edge); transition: background .08s;
  }
  #beatdot.lit { background: var(--ink); }
  body[data-move="point"] #beatdot.lit { background: var(--point); }
  body[data-move="shape"] #beatdot.lit { background: var(--shape); }
  body[data-move="path"] #beatdot.lit { background: var(--path); }
  #countdown { font-variant-numeric: tabular-nums; min-width: 1em; text-align: center; opacity: .7; }
  /* Sliders take the colour of whatever movement layer is up, so the pill reads
     as belonging to the thing that's running. */
  body[data-move="point"] input[type="range"] { accent-color: var(--point); }
  body[data-move="shape"] input[type="range"] { accent-color: var(--shape); }
  body[data-move="path"] input[type="range"] { accent-color: var(--path); }
  /* Once you've picked dancers by tapping, the count slider has nothing left to
     decide, so it says so rather than sitting there looking live. */
  .dancebar.picking #countlabel,
  .dancebar.picking #count,
  .dancebar.picking #countout { opacity: .3; }
  #countgroup { display: flex; align-items: center; gap: 5px; }

  /* The strip keeps its size and the row wraps around it, rather than the
     swatches shrinking to slivers to keep everything on one line. */
  #swatches { display: flex; gap: 4px; flex: none; justify-content: center; }
  /* min-width beats the 34px every button gets; without it the dabs inflate
     to button size and shove the row onto a third line. */
  .swatch {
    flex: none; width: 26px; min-width: 0; height: 26px; padding: 0;
    border-radius: 50%; border: 2px solid transparent;
    font-size: 13px; line-height: 1;
  }
  /* The inner ring is what makes the selection visible on the ink dab, where an
     ink border would simply vanish into it. */
  .swatch[aria-pressed="true"] {
    border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--paper);
    transform: scale(1.12);
  }
  #editpalette[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Sits where the pill sits; when both are up the pill steps aside rather
     than the two stacking on the same line. */
  #palette {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: var(--lift);
    display: flex; align-items: center; gap: 8px;
    /* Same half-viewport containing block as the pill above. */
    width: max-content; max-width: calc(100vw - 16px); flex-wrap: wrap; justify-content: center;
    padding: 6px 10px; border-radius: 999px;
    background: rgba(242, 242, 242, .96);
    background: color-mix(in srgb, var(--chrome) 96%, transparent);
    border: 1px solid var(--edge);
    box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
    z-index: 4;
  }
  /* Carried on the pill itself rather than on the document root: the demo page
     mirrors this stylesheet scoped inside a container, where a rule anchored
     to the root silently never matches. */
  .dancebar.stepped { bottom: calc(var(--lift) + 52px); }
  #pcells { display: flex; gap: 6px; }
  /* The browser's color input, wearing the same dab as the bar so the panel
     reads as the palette rather than as a form. */
  .pcell {
    width: 30px; height: 30px; min-width: 0; padding: 0;
    border: 1px solid var(--edge); border-radius: 50%;
    background: none; appearance: none; -webkit-appearance: none;
  }
  .pcell::-webkit-color-swatch-wrapper { padding: 0; }
  .pcell::-webkit-color-swatch { border: none; border-radius: 50%; }
  .pcell::-moz-color-swatch { border: none; border-radius: 50%; }
  .plain {
    height: 30px; min-width: 0; padding: 0 8px;
    font-size: 12px; background: none; border-color: transparent;
    color: var(--ink); opacity: .7;
  }

  /* --- the drawer ---------------------------------------------------------
     Every animation setting that isn't reached for mid-performance. A sheet
     rather than another bar row: the list of layers is going to keep growing,
     and a row that grows wraps onto a third line and eats the drawing. */
  #drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    max-height: 72%; display: flex; flex-direction: column;
    background: var(--chrome); border-top: 1px solid var(--edge);
    border-radius: 14px 14px 0 0;
    box-shadow: 0 -2px 14px rgba(0, 0, 0, .12);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .drawerhead {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px 6px; border-bottom: 1px solid var(--edge);
  }
  .drawerhead strong { font-size: 15px; }
  /* The drawer is taller than a phone whenever every section is open, so it
     scrolls itself rather than pushing its own bottom off the screen.
     -webkit-overflow-scrolling keeps that momentum-scrolled on iOS. */
  .drawerbody {
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    padding: 4px 12px 12px;
  }
  .drawerbody section { padding: 10px 0 4px; border-bottom: 1px solid var(--edge); }
  .drawerbody section:last-child { border-bottom: none; }
  .drawerbody h3 {
    margin: 0 0 8px; font-size: 11px; font-weight: 600;
    letter-spacing: .06em; text-transform: uppercase; opacity: .55;
  }
  .ctrl { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .ctrl + .ctrl { margin-top: 8px; }
  .ctrl label { font-size: 12px; opacity: .7; }
  .ctrl output { font-variant-numeric: tabular-nums; min-width: 1.4em; text-align: right; }
  .grow { flex: 1; min-width: 60px; }

  /* A segmented control: pick exactly one. Movement layers are mutually
     exclusive, so they get the shape that says so. */
  .seg { display: flex; gap: 0; width: 100%; }
  .seg button {
    flex: 1; min-width: 0; border-radius: 0; font-size: 12px; padding: 0 2px;
    border-left-width: 0;
  }
  .seg button:first-child { border-radius: 8px 0 0 8px; border-left-width: 1px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .seg button[data-move="point"][aria-pressed="true"] { background: var(--point); border-color: var(--point); }
  .seg button[data-move="shape"][aria-pressed="true"] { background: var(--shape); border-color: var(--shape); }
  .seg button[data-move="path"][aria-pressed="true"] { background: var(--path); border-color: var(--path); }

  /* One row per look: the toggle, then whatever that look has to say for
     itself. Built in app.js from a table, so the next look is a table entry
     rather than another slab of markup. */
  .look { display: flex; align-items: center; gap: 6px; padding: 5px 0; }
  .look + .look { border-top: 1px dashed var(--edge); }
  .look > button:first-child {
    flex: 1; justify-content: start; text-align: left;
    display: flex; align-items: center; gap: 8px; font-size: 13px;
  }
  .look > button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .look select, .drawerbody select {
    font: inherit; font-size: 12px; height: 30px;
    border: 1px solid var(--edge); border-radius: 8px;
    background: var(--paper); color: var(--ink); padding: 0 4px;
  }
  .sub { display: flex; align-items: center; gap: 6px; }

  .chk { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 10px; }
  .chk input { width: 18px; height: 18px; }

  #slots { display: flex; gap: 6px; }
  #slots button { flex: 1; font-size: 12px; }
  #slots button.filled { border-color: var(--ink); }
  button.listening { background: var(--path); color: #fff; border-color: var(--path); }

  /* --- performance mode ---------------------------------------------------
     The toolbar is in the screen recording, so there has to be a way to take
     it out. What there must NOT be is a way out with no way back: an invisible
     tap target to restore the chrome is the same mistake as the invisible
     palette gesture, so a small chevron stays on screen. */
  body.perform #bar { display: none; }
  body.perform #toast { bottom: 12px; }
  /* Clear of the chevron, which sits in the bottom-right corner: at a flat 12px
     the two share that corner and the pill's last button is under the chevron. */
  body.perform .dancebar, body.perform #palette { bottom: calc(50px + env(safe-area-inset-bottom, 0px)); }
  #unhide {
    position: fixed; z-index: 7;
    right: calc(8px + env(safe-area-inset-right, 0px));
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    width: 34px; height: 34px; min-width: 0; padding: 0;
    border-radius: 50%; opacity: .35; font-size: 15px;
  }
</style>
</head>
<body data-move="none">
  <canvas id="sheet"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- What you reach for while the music is playing. Everything else is one
       tap away in the drawer, which is what keeps this down to a pill. -->
  <div id="dancebar" class="dancebar" hidden>
    <!-- Only while the toolbar is hidden, where it is the sole way to start and
         stop. With the bar up it would be a second copy of a button already on
         screen, which is worse than no button at all. -->
    <button id="pillplay" class="step" hidden title="Start and stop">&#9654;</button>
    <span id="countgroup">
      <label for="count" id="countlabel">Dancers</label>
      <!-- Zero is a useful setting, not a degenerate one: it holds the drawing
           still so you can tap the nodes you want without chasing them. -->
      <input id="count" type="range" min="0" max="12" value="3">
      <output id="countout" for="count">3</output>
      <span class="sep" aria-hidden="true"></span>
    </span>
    <span id="beatdot" aria-hidden="true"></span>
    <output id="countdown" aria-live="off"></output>
    <span class="sep" aria-hidden="true"></span>
    <!-- A quarter note, the conventional tempo mark. The slider that used to
         sit here covered 210 BPM in about 50px and landed on every third
         value; stepping, halving, doubling and tapping all beat it. -->
    <label for="bpmout" title="Tempo, in beats per minute">&#9833;</label>
    <button id="bpmdown" class="step" title="Slower by one">&minus;</button>
    <output id="bpmout">128</output>
    <button id="bpmup" class="step" title="Faster by one">+</button>
    <button id="taptempo" class="step wide" title="Tap four times along with the track">Tap</button>
    <!-- Swapped in for the tempo group while listening: the music is the clock,
         so what's left to choose is what a note does. -->
    <span id="hearing" hidden>
      <button id="mapnotes" class="step wide" aria-pressed="true" title="Each note moves its own node">Notes</button>
      <button id="mapbeats" class="step wide" aria-pressed="false" title="Any new note fires one beat">Beats</button>
    </span>
  </div>

  <!-- All six colors in one place, rather than a gesture on the bar. Each cell
       is the browser's own color input, so tapping one is a single tap into a
       picker the user already knows. -->
  <div id="palette" hidden>
    <div id="pcells"></div>
    <button id="palettereset" class="plain">Reset</button>
  </div>

  <div id="drawer" hidden aria-label="Animation settings">
    <div class="drawerhead">
      <strong>Animate</strong>
      <button id="drawerclose" class="plain">Done</button>
    </div>
    <div class="drawerbody">
      <section>
        <h3>Tempo</h3>
        <div class="ctrl">
          <button id="half" class="step wide" title="Half tempo">&divide;2</button>
          <button id="dbpmdown" class="step" title="Slower by one">&minus;</button>
          <output id="dbpmout">128</output>
          <button id="dbpmup" class="step" title="Faster by one">+</button>
          <button id="double" class="step wide" title="Double tempo">&times;2</button>
          <button id="dtap" class="step wide" title="Tap four times along with the track">Tap</button>
        </div>
        <label class="chk"><input type="checkbox" id="countin"> Count in four beats before moving</label>
      </section>

      <section>
        <h3>Movement &mdash; one at a time</h3>
        <div class="seg" id="movement">
          <button data-move="none" aria-pressed="true">None</button>
          <button data-move="point" aria-pressed="false">&#9834; Points</button>
          <button data-move="shape" aria-pressed="false">&#9670; Shapes</button>
          <button data-move="path" aria-pressed="false">&#10148; Paths</button>
        </div>
        <div class="ctrl" id="moveopts" hidden>
          <label for="movediv">Steps</label>
          <select id="movediv"></select>
          <span class="grow"></span>
          <span class="sub" id="leashgroup">
            <label for="leash">Leash</label>
            <input id="leash" type="range" min="1" max="4" value="2">
            <output id="leashout">2</output>
          </span>
        </div>
      </section>

      <section>
        <h3>Looks &mdash; stack as many as you like</h3>
        <div id="looks"></div>
      </section>

      <section>
        <h3>Presets</h3>
        <div id="slots">
          <button data-slot="0">A</button>
          <button data-slot="1">B</button>
          <button data-slot="2">C</button>
          <button id="saveslot" class="plain">Save</button>
        </div>
      </section>

      <section>
        <h3>Music</h3>
        <div class="ctrl">
          <button id="listen" aria-pressed="false" title="Dance to whatever is playing">&#9835; Listen</button>
          <span class="grow"></span>
          <label class="chk" style="margin:0"><input type="checkbox" id="dropfx" checked> Hit on the drop</label>
        </div>
      </section>
    </div>
  </div>

  <button id="unhide" hidden title="Show the toolbar">&#9650;</button>

  <div id="bar">
    <div class="row">
      <button id="mode" data-mode="draw" title="Toggle draw / paint / move / path">Draw</button>
      <div id="swatches"></div>
      <button id="editpalette" aria-pressed="false" aria-controls="palette" title="Edit the palette">&#9998;</button>
    </div>
    <div class="row">
      <button id="play" aria-pressed="false" title="Start and stop the animation">&#9654;</button>
      <button id="animate" aria-pressed="false" aria-controls="drawer" title="Animation settings">&#9881;</button>
      <button id="dots" aria-pressed="true" title="Hide the dot grid">&#8759;</button>
      <button id="perform" title="Hide the toolbar for recording">&#9974;</button>
      <button id="undo" title="Undo last line">&#8630;</button>
      <button id="clear" title="Clear everything">&#10005;</button>
      <button id="share" title="Copy a link to this drawing">&#8599;</button>
    </div>
  </div>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
